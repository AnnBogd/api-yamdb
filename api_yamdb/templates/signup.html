<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — YaMDb</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fb;
      color: #192033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, #dce7ff 0, transparent 38%),
        radial-gradient(circle at bottom right, #e4dcff 0, transparent 38%),
        #f4f6fb;
    }

    .card {
      width: min(100%, 430px);
      padding: 36px;
      border: 1px solid rgba(98, 111, 150, 0.16);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 70px rgba(45, 58, 95, 0.14);
    }

    .logo {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border-radius: 16px;
      background: #5267e8;
      color: white;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.7px;
    }

    .description {
      margin: 0 0 28px;
      color: #68708a;
      line-height: 1.55;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #d8ddeb;
      border-radius: 13px;
      outline: none;
      background: #fff;
      color: #192033;
      font: inherit;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    input:focus {
      border-color: #6476e8;
      box-shadow: 0 0 0 4px rgba(82, 103, 232, 0.12);
    }

    input::placeholder {
      color: #a0a7bb;
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 4px;
      border: 0;
      border-radius: 13px;
      background: #5267e8;
      color: white;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, opacity 0.15s;
    }

    button:hover {
      background: #4459d5;
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .message.success {
      display: block;
      border: 1px solid #b9e8ce;
      background: #effaf4;
      color: #17643a;
    }

    .message.error {
      display: block;
      border: 1px solid #f0c2c6;
      background: #fff3f4;
      color: #972d38;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 24px;
      font-size: 13px;
    }

    a {
      color: #5267e8;
      text-decoration: none;
      font-weight: 650;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 22px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Ya</div>
    <h1>Создать аккаунт</h1>
    <p class="description">
      Введите имя пользователя и электронную почту. YaMDb отправит код
      подтверждения на указанный адрес.
    </p>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="username">Имя пользователя</label>
        <input
          id="username"
          name="username"
          type="text"
          maxlength="150"
          autocomplete="username"
          placeholder="Например, gosa"
          required
          autofocus
        >
      </div>

      <div class="field">
        <label for="email">Электронная почта</label>
        <input
          id="email"
          name="email"
          type="email"
          maxlength="254"
          autocomplete="email"
          placeholder="name@example.com"
          required
        >
      </div>

      <button id="submit-button" type="submit">Зарегистрироваться</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <nav class="links" aria-label="Ссылки проекта">
      <a href="/redoc/">Документация API</a>
      <a href="/admin/">Админ-панель</a>
    </nav>
  </main>

  <script>
    const form = document.getElementById('signup-form');
    const button = document.getElementById('submit-button');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function formatErrors(data) {
      if (!data || typeof data !== 'object') {
        return 'Не удалось зарегистрироваться. Попробуйте ещё раз.';
      }

      return Object.entries(data)
        .map(([field, errors]) => {
          const label = {
            username: 'Имя пользователя',
            email: 'Электронная почта',
            non_field_errors: 'Ошибка'
          }[field] || field;
          const text = Array.isArray(errors) ? errors.join(' ') : errors;
          return `${label}: ${text}`;
        })
        .join('\n');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      button.disabled = true;
      button.textContent = 'Отправляем…';
      message.className = 'message';

      const payload = {
        username: form.username.value.trim(),
        email: form.email.value.trim()
      };

      try {
        const response = await fetch('/api/v1/auth/signup/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage(formatErrors(data), 'error');
          return;
        }

        showMessage(
          `Готово! Пользователь ${data.username} зарегистрирован.\n` +
          `Код подтверждения отправлен на ${data.email}.`,
          'success'
        );
        form.reset();
      } catch (error) {
        showMessage(
          'Не удалось связаться с сервером. Проверьте, что он запущен.',
          'error'
        );
      } finally {
        button.disabled = false;
        button.textContent = 'Зарегистрироваться';
      }
    });
  </script>
</body>
</html>
